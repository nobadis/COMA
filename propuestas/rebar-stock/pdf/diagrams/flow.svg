<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Archivo V, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c0c0c"/></marker></defs>
  <g font-size="15">
    <!-- 1 coger -->
    <rect x="10" y="20" width="220" height="190" rx="14" fill="#f7f5f0" stroke="#0c0c0c" stroke-opacity=".15"/>
    <circle cx="40" cy="50" r="15" fill="#e1112d"/><text x="40" y="55" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <text x="64" y="56" font-weight="700" font-size="19">COGER</text>
    <rect x="70" y="80" width="100" height="10" fill="#0c0c0c"/><line x1="120" y1="68" x2="120" y2="80" stroke="#0c0c0c" stroke-width="3"/>
    <rect x="60" y="92" width="120" height="16" fill="#8f7a6a"/><rect x="88" y="96" width="9" height="12" fill="#fff" stroke="#e1112d"/><rect x="146" y="96" width="9" height="12" fill="#fff" stroke="#e1112d"/>
    <path d="M42 112a20 20 0 0 1 0-40M198 72a20 20 0 0 1 0 40" stroke="#e1112d" stroke-width="2.5" fill="none"/>
    <text x="28" y="140">Imán ON + subida del</text><text x="28" y="159">polipasto. Se leen las</text><text x="28" y="178">etiquetas de la carga.</text>
    <path d="M232 115h22" stroke="#0c0c0c" stroke-width="2" marker-end="url(#ar)"/>
    <!-- 2 desplazar -->
    <rect x="258" y="20" width="220" height="190" rx="14" fill="#f7f5f0" stroke="#0c0c0c" stroke-opacity=".15"/>
    <circle cx="288" cy="50" r="15" fill="#e1112d"/><text x="288" y="55" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="312" y="56" font-weight="700" font-size="19">DESPLAZAR</text>
    <rect x="290" y="96" width="44" height="14" fill="#8f7a6a" opacity=".35"/><rect x="290" y="82" width="44" height="12" fill="#8f7a6a" opacity=".35"/>
    <path d="M340 90h70" stroke="#0c0c0c" stroke-dasharray="5 4" marker-end="url(#ar)"/>
    <rect x="390" y="76" width="70" height="8" fill="#0c0c0c"/><rect x="384" y="86" width="82" height="12" fill="#8f7a6a"/>
    <text x="276" y="140">Las etiquetas que viajan</text><text x="276" y="159">con la grúa son la carga;</text><text x="276" y="178">las de la pila se pierden.</text>
    <path d="M480 115h22" stroke="#0c0c0c" stroke-width="2" marker-end="url(#ar)"/>
    <!-- 3 dejar -->
    <rect x="506" y="20" width="220" height="190" rx="14" fill="#f7f5f0" stroke="#0c0c0c" stroke-opacity=".15"/>
    <circle cx="536" cy="50" r="15" fill="#e1112d"/><text x="536" y="55" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <text x="560" y="56" font-weight="700" font-size="19">DEJAR</text>
    <rect x="540" y="72" width="70" height="40" fill="none" stroke="#0c0c0c" stroke-opacity=".3" stroke-width="2"/><rect x="616" y="72" width="70" height="40" fill="#e3f1e8" stroke="#2f8f5b" stroke-width="2.5"/>
    <text x="651" y="97" text-anchor="middle" font-weight="700" fill="#2f8f5b">C-03</text><circle cx="651" cy="72" r="5" fill="#e1112d"/>
    <text x="524" y="140">Imán OFF. La X/Y de la</text><text x="524" y="159">grúa en ese instante da</text><text x="524" y="178">la celda o calle.</text>
    <path d="M728 115h22" stroke="#0c0c0c" stroke-width="2" marker-end="url(#ar)"/>
    <!-- 4 resultado -->
    <rect x="754" y="20" width="236" height="190" rx="14" fill="#0c0c0c"/>
    <circle cx="784" cy="50" r="15" fill="#e1112d"/><text x="784" y="55" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="808" y="56" font-weight="700" font-size="19" fill="#efece4">RESULTADO</text>
    <text x="772" y="96" fill="#efece4">Cada movimiento recibe</text><text x="772" y="115" fill="#efece4">un estado explícito y se</text><text x="772" y="134" fill="#efece4">envía al ERP/MES con</text><text x="772" y="153" fill="#efece4">todas sus evidencias.</text>
    <text x="772" y="186" fill="#a8a39b" font-size="13">Sin escanear. Sin pulsar.</text>
  </g>
  <g font-size="14.5">
    <rect x="10" y="240" width="320" height="150" rx="14" fill="#e3f1e8"/>
    <text x="30" y="272" font-weight="750" font-size="18" fill="#2f8f5b">● VERIFICADO</text>
    <text x="30" y="300">Identidad y ubicación claras.</text><text x="30" y="320">Se registra solo. ~98 % de los</text><text x="30" y="340">movimientos (objetivo del piloto).</text>
    <text x="30" y="370" fill="#5d5851" font-size="13">Nadie hace nada.</text>
    <rect x="340" y="240" width="320" height="150" rx="14" fill="#fbefd6"/>
    <text x="360" y="272" font-weight="750" font-size="18" fill="#a86a00">● INCIERTO</text>
    <text x="360" y="300">Falta una evidencia (p. ej. borde</text><text x="360" y="320">de celda). La cabina pregunta:</text><text x="360" y="340">«¿Has dejado 004831 en B-07?»</text>
    <text x="360" y="370" fill="#5d5851" font-size="13">Un toque. Sin respuesta → supervisor.</text>
    <rect x="670" y="240" width="320" height="150" rx="14" fill="#fde4e7"/>
    <text x="690" y="272" font-weight="750" font-size="18" fill="#e1112d">● SIN IDENTIFICAR</text>
    <text x="690" y="300">Hubo movimiento sin etiqueta</text><text x="690" y="320">fiable. Se ofrecen candidatos de</text><text x="690" y="340">la zona de origen.</text>
    <text x="690" y="370" fill="#5d5851" font-size="13">Un toque. Sin respuesta → alerta.</text>
  </g>
</svg>
